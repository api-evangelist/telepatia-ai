name: Telepatia AI
description: >-
  Telepatia is an AI-native clinical platform built for Latin American
  healthcare. It listens to doctor-patient consultations and generates
  clinical documentation in real time (AI Writer), surfaces evidence-based
  clinical recommendations during the visit (AI Advisor), integrates with
  50+ electronic health record and hospital systems such as Epic, TASY,
  iClinic and MV (AI Integrator), and produces analytics on protocol
  adherence and clinical performance (AI Business Intelligence). Founded by
  Nicolas Abad and backed by a16z with a $33M Series A, the platform has
  deployed across 25+ hospital systems in Brazil, Colombia and Mexico. As of
  this enrichment pass Telepatia exposes a product and web application but
  publishes no public developer API, SDK, or developer portal.
